services:
  - type: web
    name: tmcwd-slips-demo
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: TMCWD Slips System
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: TRUSTED_PROXIES
        value: "*"
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: tmcwd-slips-demo-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: BOOTSTRAP_DEMO_ADMIN
        value: "false"

databases:
  - name: tmcwd-slips-demo-db
    databaseName: tmcwd_slips
    user: tmcwd_slips
    plan: free
    region: singapore
    postgresMajorVersion: "16"
